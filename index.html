<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- CSP: defense-in-depth. Разрешено ровно то, чем пользуется приложение:
     inline-обработчики, supabase-js (jsdelivr), курсы ЦБ, Supabase, шрифты, data/blob (PNG-чеки) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://www.cbr-xml-daily.ru https://vpic.nhtsa.dot.gov; manifest-src 'self'; object-src 'none'; base-uri 'self'">
<!-- зум не блокируем (a11y); viewport-fit=cover — фон заезжает под вырез/чёлку -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="АвтоКальк">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- apple-mobile-web-app-capable устарел: добавляем современный аналог -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#131110">
<title>Авто Калькулятор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- только реально используемые веса: JetBrains 400/600/700, Oswald 400 (плейсхолдер)/600/700 -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<!-- ?v=N — версия файлов: при каждом релизе меняется здесь и в sw.js (const V),
     чтобы кэш браузера не подсовывал устаревшие скрипты -->
<link rel="stylesheet" href="styles.css?v=93">
</head>
<body>
<div class="container" id="app"></div>
<div id="confirm-dialog"></div>
<div id="toast"></div>
<input type="file" id="import-file" accept=".json" style="display:none">
<script src="js/core.js?v=93"></script>
<script src="js/cbr.js?v=93"></script>
<script src="js/cloud.js?v=93"></script>
<script src="js/calc.js?v=93"></script>
<script src="js/warehouse.js?v=93"></script>
<script src="js/vin.js?v=93"></script>
<script src="js/charts.js?v=93"></script>
<script src="js/stats.js?v=93"></script>
<script src="js/receipt.js?v=93"></script>
<script src="js/export.js?v=93"></script>
<script src="js/main.js?v=93"></script>
</body>
</html>
