<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="АвтоКальк">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1a1a2e">
<title>Авто Калькулятор</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#1a1a2e;--card:#16213e;--card2:#1a1a3e;--input:#0f1a30;--deep:#0a0f1e;
--key:#1a2240;--key-br:#2a3250;--br:#2a2a4a;--br2:#2a3a5a;--br3:#1a2a4a;
--line:#151f35;--line2:#0d1025;--calc1:#1e2a4a;--calc2:#16213e;
--gold:#e8d44d;--ok2:#82e0aa;--info:#7fb3d3;
--t0:#fff;--t1:#ccc;--t2:#aaa;--t3:#888;--t4:#667;--t5:#556;
--cur-eur:#d4e6f1;--cur-usd:#d5f5e3;--cur-rub:#fadbd8;
--clr-bg:#5a2020;--clr-t:#ff6b6b;--clr-br:#6a3030;--bk-bg:#3a3020;--bk-br:#4a4030}
body.light{
--bg:#eef0f5;--card:#ffffff;--card2:#f3f5fa;--input:#f6f7fb;--deep:#f0f2f8;
--key:#f7f8fc;--key-br:#d5dae8;--br:#dde2ee;--br2:#c5cde0;--br3:#dde2ee;
--line:#e8ebf3;--line2:#edeff6;--calc1:#ffffff;--calc2:#f2f4fa;
--gold:#a8820a;--ok2:#1e8449;--info:#1a5276;
--t0:#1c2030;--t1:#2c3142;--t2:#454b60;--t3:#5d6478;--t4:#767d92;--t5:#9aa1b5;
--cur-eur:#1a5276;--cur-usd:#1e6e3e;--cur-rub:#922b21;
--clr-bg:#fdeaea;--clr-t:#c0392b;--clr-br:#f2c4c4;--bk-bg:#fdf6dc;--bk-br:#ecd98e}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);font-family:'JetBrains Mono','Courier New',monospace;
padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));
display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes receiptPrint{from{max-height:0;opacity:0}to{max-height:6000px;opacity:1}}
.container{width:100%;max-width:420px}
.header{text-align:center;margin-bottom:10px;padding:12px 0 4px}
.header h1{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase}
.header p{color:var(--t4);font-size:11px;margin-top:3px}
.jump-row{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.jump-chip{padding:5px 12px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;
background:var(--card);color:var(--t4);border:1px solid var(--br);letter-spacing:.5px}
.jump-chip:active{transform:scale(.93)}
.car-name-input{width:100%;padding:12px 16px;background:var(--card);border:1px solid var(--br2);border-radius:12px;color:var(--gold);font-size:15px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:1px;outline:none;text-align:center;margin-bottom:12px}
.car-name-input::placeholder{color:var(--t5);font-weight:400}
.coll-box{background:var(--card);border-radius:12px;border:1px solid var(--br);margin-bottom:12px;overflow:hidden}
.coll-header{padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--card2)}
.coll-header span:first-child{color:var(--t2);font-size:13px;font-weight:500}
.coll-arrow{color:var(--t4);font-size:18px;transition:transform .2s}
.coll-body{padding:12px 16px;animation:fadeIn .2s ease}
.rates-row{display:flex;gap:12px}
.rate-label{color:var(--info);font-size:11px;font-weight:600;display:block}.rate-label.usd{color:var(--ok2)}
.rate-input{width:100%;margin-top:4px;padding:8px 10px;background:var(--input);border:1px solid var(--br2);border-radius:8px;font-size:16px;font-family:'JetBrains Mono',monospace;outline:none}
.rate-input.eur{color:var(--cur-eur)}.rate-input.usd{color:var(--cur-usd)}
.rate-hint{color:var(--t5);font-size:9px;margin-top:6px;line-height:1.4}
.categories{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.cat-btn{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px;background:var(--card);color:var(--t3);border:1px solid var(--br);transition:all .15s;white-space:nowrap}
.cat-btn.active{font-weight:700;background:var(--gold);color:#1a1a2e;border-color:var(--gold)}.cat-btn:active{transform:scale(.93)}
.calc-body{background:linear-gradient(145deg,var(--calc1),var(--calc2));border-radius:16px;border:1px solid var(--br2);padding:16px;margin-bottom:12px;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05)}
.display-box{background:var(--deep);border-radius:10px;padding:10px 16px;margin-bottom:14px;border:1px solid var(--br3);box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.display-cat{color:var(--t5);font-size:11px;margin-bottom:2px}
.display-num{color:var(--gold);font-weight:700;text-align:right;text-shadow:0 0 20px rgba(232,212,77,.3);overflow:hidden;white-space:nowrap;font-family:'Oswald',sans-serif;letter-spacing:1px}
.numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.btn-calc{padding:14px 0;text-align:center;border-radius:10px;cursor:pointer;font-weight:600;font-family:'Oswald',sans-serif;background:var(--key);color:var(--t1);border:1px solid var(--key-br);transition:all .1s;font-size:20px}
.btn-calc:active{transform:scale(.93)}
.btn-calc.clear{background:var(--clr-bg);color:var(--clr-t);border-color:var(--clr-br)}
.btn-calc.back{background:var(--bk-bg);color:var(--gold);border-color:var(--bk-br);font-size:18px}
.btn-calc.triple{font-size:17px}
.currency-row{display:flex;gap:8px}
.btn-currency{flex:1;padding:12px 0;text-align:center;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:1px;transition:all .1s}
.btn-currency:active{transform:scale(.95)}
.btn-currency.eur{background:#d4e6f1;color:#1a5276;border:2px solid #1a5276}
.btn-currency.usd{background:#d5f5e3;color:#1e6e3e;border:2px solid #1e6e3e}
.btn-currency.rub{background:#fadbd8;color:#922b21;border:2px solid #922b21}
.entries-box{background:var(--card);border-radius:12px;border:1px solid var(--br);margin-bottom:12px;overflow:hidden}
.entries-header{padding:10px 16px;border-bottom:1px solid var(--br);color:var(--t3);font-size:11px;font-weight:600;display:flex;justify-content:space-between}
.entry-row{padding:8px 16px;display:flex;justify-content:space-between;align-items:center;animation:fadeIn .25s ease}
.entry-row+.entry-row{border-top:1px solid var(--card2)}
.entry-label{color:var(--t2);font-size:12px}
.entry-rate{color:var(--t5);font-size:9px;margin-top:1px}
.entry-amount{font-size:14px;font-weight:600}
.entry-amount.eur{color:var(--cur-eur)}.entry-amount.usd{color:var(--cur-usd)}.entry-amount.rub{color:var(--cur-rub)}
.entry-rub{color:var(--t5);font-size:10px}
.entry-act{cursor:pointer;font-size:13px;padding:4px 6px;transition:opacity .15s}
.entry-act.del{opacity:.3;color:#ff6b6b}.entry-act.edit{opacity:.4;color:var(--gold)}
.entry-act:active{opacity:1}
.entry-edit-form{padding:10px 16px;background:var(--input);animation:fadeIn .2s ease}
.entry-edit-input{width:100%;padding:10px 12px;background:var(--input);border:1px solid var(--br2);border-radius:8px;font-size:16px;color:var(--t0);font-family:'JetBrains Mono',monospace;outline:none;margin-bottom:8px}
.edit-lbl{color:var(--t4);font-size:9px;font-weight:600;display:block;margin-bottom:3px;letter-spacing:.5px}
.btn-action{padding:14px 0;text-align:center;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:2px;font-family:'Oswald',sans-serif;text-transform:uppercase;transition:all .15s;margin-bottom:10px}
.btn-action:active{transform:scale(.96)}
.btn-yellow{background:linear-gradient(135deg,var(--gold),#d4a017);color:#1a1a2e;box-shadow:0 4px 16px rgba(232,212,77,.3)}
.btn-green{background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;box-shadow:0 4px 16px rgba(39,174,96,.3)}
.btn-red{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;box-shadow:0 4px 16px rgba(231,76,60,.2)}
.btn-blue{background:linear-gradient(135deg,#3498db,#2471a3);color:#fff;box-shadow:0 4px 16px rgba(52,152,219,.3)}
.btn-outline{background:transparent;border:2px solid var(--br2);color:var(--t3)}
.profit-box{background:var(--card);border-radius:12px;border:1px solid var(--br);margin-bottom:12px;overflow:hidden}
.profit-body{padding:16px;animation:fadeIn .2s ease}
.profit-input-group{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.profit-input-group label{color:var(--t3);font-size:11px;font-weight:600;white-space:nowrap;min-width:80px}
.profit-input{flex:1;padding:10px 12px;background:var(--input);border:1px solid var(--br2);border-radius:8px;font-size:16px;color:var(--t0);font-family:'JetBrains Mono',monospace;outline:none}
.profit-input:focus{border-color:var(--gold)}
.profit-curr-row{display:flex;gap:6px;margin-bottom:14px}
.pcb{flex:1;padding:8px 0;text-align:center;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1px;transition:all .15s;border:2px solid var(--br2);background:var(--input);color:var(--t4)}
.pcb.a-rub{background:#fadbd8;color:#922b21;border-color:#922b21}
.pcb.a-eur{background:#d4e6f1;color:#1a5276;border-color:#1a5276}
.pcb.a-usd{background:#d5f5e3;color:#1e6e3e;border-color:#1e6e3e}
.pr-box{background:var(--deep);border-radius:10px;padding:14px 16px;border:1px solid var(--br3)}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.pr-row+.pr-row{border-top:1px solid var(--line)}
.pr-lbl{color:var(--t3);font-size:11px}.pr-val{font-size:14px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:1px}
.pr-val.pos{color:#27ae60}.pr-val.neg{color:#e74c3c}.pr-val.ntl{color:var(--t3)}
.pr-bar{margin-top:12px}.pr-bar-bg{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.pr-bar-fill{height:100%;border-radius:4px;transition:width .4s ease,background .3s ease}
.pr-bar-labels{display:flex;justify-content:space-between;margin-top:4px}.pr-bar-labels span{font-size:9px;color:var(--t5)}
.pr-big{text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pr-big .big-pct{font-family:'Oswald',sans-serif;font-size:36px;font-weight:700;letter-spacing:2px}
.pr-big .big-pct.pos{color:#27ae60;text-shadow:0 0 30px rgba(39,174,96,.3)}
.pr-big .big-pct.neg{color:#e74c3c;text-shadow:0 0 30px rgba(231,76,60,.3)}
.pr-big .big-pct.ntl{color:var(--t5)}.pr-big .big-lbl{font-size:10px;color:var(--t5);margin-top:2px}
.section-divider{margin:28px 0 14px;text-align:center;position:relative}
.section-divider::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--br2),transparent)}
.section-divider span{position:relative;background:var(--bg);padding:0 16px;font-family:'Oswald',sans-serif;
font-size:16px;font-weight:700;color:var(--gold);letter-spacing:3px;text-transform:uppercase}
.section-divider.sold span{color:#e74c3c}
.section-divider.stats span{color:#3498db}
.stats-bar{display:flex;gap:8px;margin-bottom:14px}
.stat-card{flex:1;background:var(--card);border-radius:10px;padding:10px 8px;text-align:center;border:1px solid var(--br)}
.stat-num{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px}
.stat-num.gold{color:var(--gold)}.stat-num.green{color:#27ae60}.stat-num.red{color:#e74c3c}.stat-num.blue{color:#3498db}
.stat-lbl{font-size:9px;color:var(--t5);margin-top:2px}
.backup-row{display:flex;gap:8px;margin-bottom:14px}
.backup-btn{flex:1;padding:9px 0;text-align:center;border-radius:8px;cursor:pointer;font-size:10px;font-weight:600;
letter-spacing:1px;background:var(--card);color:var(--t4);border:1px solid var(--br);font-family:'Oswald',sans-serif}
.backup-btn:active{transform:scale(.95)}
.wh-card{background:var(--card);border-radius:12px;border:1px solid var(--br);margin-bottom:10px;overflow:hidden;animation:slideUp .3s ease}
.wh-card-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.wh-car-name{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--gold);letter-spacing:1px}
.wh-car-cost{font-size:13px;font-weight:600;color:var(--t2)}
.wh-status{display:inline-block;padding:2px 8px;border-radius:6px;font-size:9px;font-weight:700;letter-spacing:1px;margin-left:8px}
.wh-status.stock{background:#1a3a2a;color:#27ae60;border:1px solid #27ae60}
.wh-status.sold{background:#3a1a1a;color:#e74c3c;border:1px solid #e74c3c}
.wh-detail{padding:0 16px 14px;animation:fadeIn .2s ease}
.wh-detail-row{display:flex;justify-content:space-between;padding:4px 0;font-size:11px}
.wh-detail-row+.wh-detail-row{border-top:1px solid var(--line2)}
.wh-detail-lbl{color:var(--t4)}.wh-detail-val{color:var(--t1);font-weight:600}
.wh-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.wh-actions .btn-action{flex:1;margin-bottom:0;font-size:11px;padding:10px 0;letter-spacing:1px}
.wh-sell-form{padding:12px 16px;border-top:1px solid var(--br);animation:fadeIn .2s ease}
.wh-sell-input{width:100%;padding:10px 12px;background:var(--input);border:1px solid var(--br2);border-radius:8px;font-size:16px;color:var(--t0);font-family:'JetBrains Mono',monospace;outline:none;margin-bottom:8px}
.wh-sell-input:focus{border-color:var(--gold)}
.sell-rate-lbl{color:var(--t4);font-size:9px;font-weight:600;display:block;margin-bottom:3px;letter-spacing:.5px}
.edit-entry-card{background:var(--input);border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--br3)}
.edit-entry-title{color:var(--t2);font-size:11px;font-weight:600;margin-bottom:6px}
.edit-fields{display:flex;gap:8px}
.edit-field{flex:1}
.edit-input{width:100%;padding:8px 10px;background:var(--input);border:1px solid var(--br2);border-radius:8px;font-size:15px;color:var(--t0);font-family:'JetBrains Mono',monospace;outline:none}
.edit-input:focus{border-color:var(--gold)}
.edit-cost-preview{background:var(--deep);border-radius:10px;padding:12px 14px;margin:10px 0;border:1px solid var(--br2);
display:flex;justify-content:space-between;align-items:center}
.edit-cost-preview .ecp-lbl{color:var(--t3);font-size:11px;font-weight:600}
.edit-cost-preview .ecp-val{color:var(--gold);font-size:18px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:1px}
.bulk-rate-row{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end}
.bulk-rate-field{flex:1}
.bulk-apply{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:10px;font-weight:700;
background:var(--br2);color:var(--t2);border:1px solid var(--key-br);font-family:'Oswald',sans-serif;letter-spacing:1px;white-space:nowrap}
.bulk-apply:active{transform:scale(.95)}
.month-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:11px}
.month-row+.month-row{border-top:1px solid var(--card2)}
.month-lbl{color:var(--t3);min-width:70px}
.month-bar-wrap{flex:1;margin:0 10px;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.month-bar{height:100%;border-radius:4px}
.month-val{font-weight:700;font-family:'Oswald',sans-serif;font-size:12px;min-width:80px;text-align:right}
.empty-state{text-align:center;padding:26px 20px;color:var(--t5)}
.empty-state .em-icon{font-size:40px;margin-bottom:10px}.empty-state .em-text{font-size:12px}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
.confirm-box{background:var(--card2);border-radius:16px;border:1px solid var(--br2);padding:24px;max-width:320px;width:100%;text-align:center}
.confirm-box p{color:var(--t1);font-size:13px;margin-bottom:16px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}.confirm-btns .btn-action{flex:1;margin:0;font-size:12px;padding:12px 0}
.receipt-wrap{width:100%;max-width:380px;margin-bottom:20px;overflow:hidden}
.receipt-wrap.animate{animation:receiptPrint .8s ease forwards}
.receipt{background:#fef9e7;padding:24px 20px;font-family:'JetBrains Mono','Courier New',monospace;color:#2c2c2c;position:relative}
.perf-top,.perf-bottom{position:absolute;left:0;right:0;height:8px;background-image:radial-gradient(circle,var(--bg) 3px,transparent 3px);background-size:12px 12px}
.perf-top{top:0;background-position:0 -4px}.perf-bottom{bottom:0;background-position:0 4px}
.receipt-title{text-align:center;margin-bottom:16px;margin-top:4px}
.receipt-title h2{font-size:16px;font-weight:700;letter-spacing:3px;font-family:'Oswald',sans-serif}
.r-sub{font-size:10px;color:#888;margin-top:4px}
.r-car{font-size:14px;font-weight:700;margin-top:6px;font-family:'Oswald',sans-serif;letter-spacing:1px;color:#2c2c2c;padding:6px 20px;border-top:1px solid #ddd;border-bottom:1px solid #ddd;margin-left:-20px;margin-right:-20px;background:linear-gradient(90deg,transparent,rgba(232,212,77,.15),transparent)}
.r-date{font-size:10px;color:#aaa;margin-top:4px}
.r-dash{border-bottom:2px dashed #ccc;margin:12px 0}.r-dash-bold{border-bottom:2px dashed #2c2c2c;margin:12px 0}
.r-il{font-size:11px;font-weight:600}.r-ir{font-size:12px;display:flex;justify-content:space-between;padding-left:4px}
.r-irl{color:#888}.r-irr{font-weight:600}
.r-total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:1px}
.r-footer{text-align:center;font-size:10px;color:#aaa;letter-spacing:2px}
.r-pr{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.r-prl{color:#888}.r-prv{font-weight:600}.r-prv.pos{color:#1e8449}.r-prv.neg{color:#922b21}
.r-prb{text-align:center;margin-top:4px;font-family:'Oswald',sans-serif;font-size:22px;font-weight:700}
.r-prb.pos{color:#1e8449}.r-prb.neg{color:#922b21}
.btn-save{margin-top:12px;padding:14px 0;text-align:center;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:2px;background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;transition:all .15s;box-shadow:0 4px 16px rgba(39,174,96,.3)}
.saved-preview{margin-top:12px;text-align:center;animation:fadeIn .3s ease}
.saved-preview p{color:var(--ok2);font-size:11px;margin-bottom:8px;font-weight:600;letter-spacing:1px}
.saved-preview img{width:100%;border-radius:8px;border:2px solid #27ae60;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.torn-edge{display:block}
</style>
</head>
<body>
<div class="container" id="app"></div>
<div id="confirm-dialog"></div>
<input type="file" id="import-file" accept=".json" style="display:none">
<script>
const CATS=[
{id:"car_price",label:"Стоимость авто",icon:"🚗"},
{id:"logistics",label:"Логистика",icon:"🚢"},

function loadSbLib(cb){
if(window.supabase)return cb();
const s=document.createElement("script");
s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
s.onload=cb;s.onerror=()=>{setStatus("нет интернета");};
document.head.appendChild(s)}

function initCloud(){
if(!CL.url||!CL.key)return;
loadSbLib(()=>{
try{CL.sb=window.supabase.createClient(CL.url,CL.key);
CL.sb.auth.getSession().then(({data})=>{
if(data&&data.session){CL.user=data.session.user;setStatus("вход выполнен");fullSync()}
else{setStatus("нужен вход");renderCloudBox()}});
}catch(e){setStatus("ошибка настроек")}})}

function qOp(op){if(!CL.url)return;CL.queue.push(op);saveQueue();flushQueue()}

async function flushQueue(){
if(CL.busy||!CL.sb||!CL.user||!navigator.onLine||!CL.queue.length)return;
CL.busy=true;setStatus("синхронизация...");
try{
while(CL.queue.length){
const op=CL.queue[0];
if(op.t==="u"){const{error}=await CL.sb.from("cars").upsert({id:op.car.id,data:op.car,updated_at:new Date().toISOString()});if(error)throw error}
else if(op.t==="d"){const{error}=await CL.sb.from("cars").delete().eq("id",op.id);if(error)throw error}
CL.queue.shift();saveQueue()}
setStatus("синхронизировано ✓")}
catch(e){setStatus("ошибка сети — повторю позже")}
CL.busy=false}

async function fullSync(){
if(!CL.sb||!CL.user||!navigator.onLine)return;
setStatus("синхронизация...");
try{
// 1) отправляем локальные изменения
await flushQueue();
// 2) забираем облако
const{data,error}=await CL.sb.from("cars").select("id,data");
if(error)throw error;
const cloudCars=(data||[]).map(r=>r.data);
const cloudIds=new Set(cloudCars.map(c=>c.id));
// 3) машины, которых нет в облаке (созданы офлайн до входа) — отправляем
const toPush=S.warehouse.filter(c=>!cloudIds.has(c.id));
for(const car of toPush){
const{error:e2}=await CL.sb.from("cars").upsert({id:car.id,data:car,updated_at:new Date().toISOString()});
if(e2)throw e2;cloudCars.push(car)}
// 4) облако — источник истины
S.warehouse=cloudCars.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
saveWH();setStatus("синхронизировано ✓");render()}
catch(e){setStatus("ошибка синхронизации")}}

window.addEventListener("online",()=>{flushQueue()});

// ===== HELPERS =====
function fmt(n){return n.toLocaleString("ru-RU",{maximumFractionDigits:0})}
function fmtD(n,d){return n.toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d})}
// Курс позиции: свой (зафиксированный), иначе общий курс машины/черновика
function entryRate(e,er,ur){if(e.currency==="RUB")return 1;
if(e.rate&&parseFloat(e.rate))return parseFloat(e.rate);
return parseFloat((e.currency==="EUR"?er:ur)||0)}
function entryRub(e,er,ur){return e.amount*entryRate(e,er,ur)}
function totR(entries,er,ur){return entries.reduce((s,e)=>s+entryRub(e,er,ur),0)}
function toR(a,c,er,ur){if(c==="RUB")return a;if(c==="EUR")return a*parseFloat(er||0);if(c==="USD")return a*parseFloat(ur||0);return 0}
function ds(){return new Date().toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function dShort(d){try{return new Date(d).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})}catch(e){return d}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function carCost(car){return totR(car.entries,car.eurRate,car.usdRate)}
function carSellRub(car){const er=car.sellEurRate||car.eurRate,ur=car.sellUsdRate||car.usdRate;
return toR(parseFloat(car.sellPrice)||0,car.sellCurrency,er,ur)}
function carProfit(car){return carSellRub(car)-carCost(car)}
function daysBetween(d1,d2){try{return Math.max(0,Math.round((new Date(d2)-new Date(d1))/86400000))}catch(e){return 0}}

function tri(n){if(S.display!=="0"){S.display+=n;rDisp()}}

S.entries[i].rate=S.editCurr==="RUB"?"":(S.editRate||(S.editCurr==="EUR"?S.eurRate:S.usdRate));

function printR(){S.showReceipt=true;S.receiptImage=null;render();

function rDisp(){const el=document.getElementById("calc-display");if(!el)return render();
const l=S.display.length;el.style.fontSize=(l>12?24:l>8?30:36)+"px";el.textContent=fmt(parseFloat(S.display||"0"))}
function rProfit(){const t=totR(S.entries,S.eurRate,S.usdRate);
const el=document.getElementById("pr-results");if(el)el.innerHTML=prHTML(pCalc(t))}
function pCalc(cost){const sell=toR(parseFloat(S.sellPrice)||0,S.sellCurrency,S.eurRate,S.usdRate);const pr=sell-cost;
return{cost,sell,profit:pr,markup:cost>0?(pr/cost)*100:0,margin:sell>0?(pr/sell)*100:0}}

function prHTML(pd){const hs=pd.sell>0,ip=pd.profit>=0,c=!hs?"ntl":ip?"pos":"neg",
bw=!hs?0:Math.min(Math.abs(pd.markup),100),bc=!hs?"#333":ip?"#27ae60":"#e74c3c";
return`<div class="pr-row"><span class="pr-lbl">Себестоимость</span><span class="pr-val ntl">${fmt(pd.cost)} ₽</span></div>
<div class="pr-row"><span class="pr-lbl">Цена продажи</span><span class="pr-val ${c}">${hs?fmt(pd.sell)+" ₽":"—"}</span></div>
<div class="pr-row"><span class="pr-lbl">Прибыль</span><span class="pr-val ${c}">${hs?(ip?"+":"")+fmt(pd.profit)+" ₽":"—"}</span></div>
<div class="pr-row"><span class="pr-lbl">Наценка</span><span class="pr-val ${c}">${hs?(ip?"+":"")+fmtD(pd.markup,1)+"%":"—"}</span></div>
<div class="pr-row"><span class="pr-lbl">Маржа</span><span class="pr-val ${c}">${hs?(ip?"+":"")+fmtD(pd.margin,1)+"%":"—"}</span></div>
<div class="pr-bar"><div class="pr-bar-bg"><div class="pr-bar-fill" style="width:${bw}%;background:${bc}"></div></div>
<div class="pr-bar-labels"><span>0%</span><span>50%</span><span>100%</span></div></div>
<div class="pr-big"><div class="big-pct ${c}">${hs?(ip?"+":"")+fmtD(pd.markup,1)+"%":"—"}</div><div class="big-lbl">НАЦЕНКА</div></div>`}

function startCarEdit(id){const car=S.warehouse.find(c=>c.id===id);if(!car)return;
S.editingCarId=id;S.sellingCarId=null;S.expandedCar=id;
S.editCarEntries=car.entries.map(e=>({...e,
rate:e.rate||(e.currency==="EUR"?car.eurRate:e.currency==="USD"?car.usdRate:"")}));
S.bulkEur=S.eurRate;S.bulkUsd=S.usdRate;render()}
function cancelCarEdit(){S.editingCarId=null;S.editCarEntries=null;render()}
function saveCarEdit(id){const car=S.warehouse.find(c=>c.id===id);if(!car||!S.editCarEntries)return;
for(const e of S.editCarEntries){if(!(parseFloat(e.amount)>0)){alert("Проверьте суммы — есть пустые или нулевые");return}
if(e.currency!=="RUB"&&!(parseFloat(e.rate)>0)){alert("Проверьте курсы — есть пустые");return}}
car.entries=S.editCarEntries.map(e=>({...e,amount:parseFloat(e.amount),rate:e.currency==="RUB"?"":String(e.rate)}));
S.editingCarId=null;S.editCarEntries=null;saveWH();cloudUpsert(car);render()}
function updEditEntry(i,field,val){if(!S.editCarEntries)return;S.editCarEntries[i][field]=val;updEditCost()}
function updEditCost(){if(!S.editCarEntries)return;
const car=S.warehouse.find(c=>c.id===S.editingCarId);if(!car)return;
const entries=S.editCarEntries.map(e=>({...e,amount:parseFloat(e.amount)||0}));
const cost=totR(entries,car.eurRate,car.usdRate);
const el=document.getElementById("edit-cost-val");if(el)el.textContent=fmt(cost)+" ₽";
// разница с исходной
const orig=carCost(car);const diff=cost-orig;
const del=document.getElementById("edit-cost-diff");
if(del){del.textContent=(diff===0?"без изменений":(diff>0?"+":"")+fmt(diff)+" ₽ к исходной");
del.style.color=diff>0?"#e74c3c":diff<0?"#27ae60":"#556"}}
function bulkApply(curr){if(!S.editCarEntries)return;
const v=curr==="EUR"?S.bulkEur:S.bulkUsd;if(!(parseFloat(v)>0)){alert("Введите курс");return}
S.editCarEntries.forEach(e=>{if(e.currency===curr)e.rate=v});render()}

document.getElementById("import-file").addEventListener("change",function(ev){
const f=ev.target.files[0];if(!f)return;
const reader=new FileReader();
reader.onload=e=>{try{const data=JSON.parse(e.target.result);
const cars=Array.isArray(data)?data:(data.warehouse||[]);
if(!Array.isArray(cars)||!cars.length){alert("Файл не содержит данных склада");return}
showConfirm(`Найдено машин: ${cars.length}. Добавить к текущему складу? (дубликаты по ID будут обновлены)`,()=>{
cars.forEach(nc=>{const i=S.warehouse.findIndex(c=>c.id===nc.id);
if(i>=0)S.warehouse[i]=nc;else S.warehouse.push(nc);cloudUpsert(nc)});
saveWH();render()})}catch(err){alert("Ошибка чтения файла")}};
reader.readAsText(f);ev.target.value=""});

function statsHTML(){
const sld=S.warehouse.filter(c=>c.status==="sold"&&c.sellDate);
let h=`<div class="section-divider stats" id="stats-section"><span>📈 Статистика</span></div>`;
if(!sld.length)return h+`<div class="empty-state"><div class="em-icon">📈</div><div class="em-text">Появится после первых продаж</div></div>`;
const tp=sld.reduce((s,c)=>s+carProfit(c),0);
const avgMargin=sld.reduce((s,c)=>{const cost=carCost(c);return s+(cost>0?(carProfit(c)/cost)*100:0)},0)/sld.length;
const avgDays=sld.reduce((s,c)=>s+daysBetween(c.date,c.sellDate),0)/sld.length;
h+=`<div class="stats-bar">
<div class="stat-card"><div class="stat-num ${tp>=0?"green":"red"}">${tp>=0?"+":""}${fmt(tp)}</div><div class="stat-lbl">ОБЩАЯ ПРИБЫЛЬ ₽</div></div>
<div class="stat-card"><div class="stat-num ${avgMargin>=0?"green":"red"}">${avgMargin>=0?"+":""}${fmtD(avgMargin,1)}%</div><div class="stat-lbl">СРЕДНЯЯ НАЦЕНКА</div></div>
<div class="stat-card"><div class="stat-num blue">${Math.round(avgDays)}</div><div class="stat-lbl">СР. ДНЕЙ ДО ПРОДАЖИ</div></div></div>`;
const months={};
sld.forEach(c=>{const d=new Date(c.sellDate);const k=String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
months[k]=(months[k]||0)+carProfit(c)});
const keys=Object.keys(months).sort((a,b)=>{const[a1,a2]=a.split(".");const[b1,b2]=b.split(".");
return(b2+b1).localeCompare(a2+a1)});
const maxV=Math.max(...keys.map(k=>Math.abs(months[k])),1);
h+=`<div class="coll-box"><div class="coll-header" style="cursor:default"><span>📅 Прибыль по месяцам</span></div>
<div class="coll-body">`;
keys.forEach(k=>{const v=months[k];const w=Math.round(Math.abs(v)/maxV*100);
h+=`<div class="month-row"><span class="month-lbl">${k}</span>
<div class="month-bar-wrap"><div class="month-bar" style="width:${w}%;background:${v>=0?"#27ae60":"#e74c3c"}"></div></div>
<span class="month-val" style="color:${v>=0?"#27ae60":"#e74c3c"}">${v>=0?"+":""}${fmt(v)} ₽</span></div>`});
h+=`</div></div>`;
return h}

h+=`<div class="r-dash-bold"></div><div class="r-total"><span>СЕБЕСТОИМОСТЬ:</span><span>${fmt(t)} ₽</span></div>`;
if(hs){h+=`<div class="r-dash"></div>
<div class="r-pr"><span class="r-prl">Цена продажи:</span><span class="r-prv">${fmt(pd.sell)} ₽</span></div>
<div class="r-pr"><span class="r-prl">Прибыль:</span><span class="r-prv ${ip?"pos":"neg"}">${ip?"+":""}${fmt(pd.profit)} ₽</span></div>
<div class="r-pr"><span class="r-prl">Наценка:</span><span class="r-prv ${ip?"pos":"neg"}">${ip?"+":""}${fmtD(pd.markup,1)}%</span></div>
<div class="r-pr"><span class="r-prl">Маржа:</span><span class="r-prv ${ip?"pos":"neg"}">${ip?"+":""}${fmtD(pd.margin,1)}%</span></div>
<div class="r-prb ${ip?"pos":"neg"}">${ip?"+":""}${fmt(pd.profit)} ₽</div>`}
h+=`<div class="r-dash"></div><div class="r-footer">СПАСИБО ЗА РАСЧЁТ!<br>★ ★ ★</div><div class="perf-bottom"></div></div>
<svg class="torn-edge" width="100%" height="16" viewBox="0 0 380 16" preserveAspectRatio="none">
<path d="${Array.from({length:38},(_,i)=>`${i===0?"M":"L"}${i*10},${i%2===0?0:12}`).join(" ")} L380,0 L380,16 L0,16 Z" fill="#fef9e7"/></svg>
<div class="btn-save" onclick="saveCalcReceipt()">💾 СОХРАНИТЬ ЧЕК</div>
${S.receiptImage?`<div class="saved-preview" id="saved-img"><p>✅ ЗАЖМИТЕ КАРТИНКУ ДЛЯ СОХРАНЕНИЯ</p><img src="${S.receiptImage}" alt="Чек"></div>`:""}</div>`;
return h}

function drawReceiptPNG(opts){
const W=400,sc=2,cv=document.createElement("canvas"),cx=cv.getContext("2d");
const cost=totR(opts.entries,opts.eurRate,opts.usdRate);
let sellRub=0,profit=0,markup=0,margin=0,hasSell=false;
if(opts.sell&&parseFloat(opts.sell.price)){hasSell=true;
sellRub=toR(parseFloat(opts.sell.price),opts.sell.currency,opts.sell.eurRate,opts.sell.usdRate);
profit=sellRub-cost;markup=cost>0?(profit/cost)*100:0;margin=sellRub>0?(profit/sellRub)*100:0}
let tH=60;if(opts.name)tH+=28;tH+=24+20+16+opts.entries.length*38+20+28;
if(hasSell)tH+=140;tH+=50+30;
cv.width=W*sc;cv.height=tH*sc;cx.scale(sc,sc);cx.fillStyle="#fef9e7";cx.fillRect(0,0,W,tH);
for(let x=6;x<W;x+=12){cx.beginPath();cx.arc(x,0,3,0,Math.PI*2);cx.fillStyle="#fff";cx.fill()}
const px=28,rx=W-px,mx=W/2;let y=28;cx.textBaseline="top";
cx.fillStyle="#2c2c2c";cx.font="bold 17px 'Courier New',monospace";cx.textAlign="center";cx.fillText("★ АВТО КАЛЬКУЛЯТОР ★",mx,y);y+=22;
cx.font="11px 'Courier New',monospace";cx.fillStyle="#888";cx.fillText(hasSell?"ОТЧЁТ ПО СДЕЛКЕ":"РАСЧЁТ СЕБЕСТОИМОСТИ",mx,y);y+=18;
if(opts.name){cx.fillStyle="#2c2c2c";cx.font="bold 14px 'Courier New',monospace";cx.fillText(opts.name.toUpperCase(),mx,y);y+=22}
cx.font="10px 'Courier New',monospace";cx.fillStyle="#aaa";cx.fillText(ds(),mx,y);y+=18;
cx.setLineDash([4,3]);cx.strokeStyle="#ccc";cx.lineWidth=1;cx.beginPath();cx.moveTo(px,y);cx.lineTo(rx,y);cx.stroke();y+=14;
cx.setLineDash([]);
opts.entries.forEach(e=>{const cm=CUR[e.currency];
const r=entryRate(e,opts.eurRate,opts.usdRate),rv=entryRub(e,opts.eurRate,opts.usdRate);
cx.fillStyle="#2c2c2c";cx.font="bold 11px 'Courier New',monospace";cx.textAlign="left";cx.fillText(e.label,px,y);y+=16;
cx.font="12px 'Courier New',monospace";cx.fillStyle="#888";cx.textAlign="left";
cx.fillText(fmt(e.amount)+" "+cm.symbol+(e.currency!=="RUB"?" × "+fmtD(r,2):""),px+4,y);
cx.fillStyle="#2c2c2c";cx.font="bold 12px 'Courier New',monospace";cx.textAlign="right";cx.fillText(fmt(rv)+" ₽",rx,y);y+=20});
cx.setLineDash([]);cx.strokeStyle="#2c2c2c";cx.lineWidth=2;cx.beginPath();cx.moveTo(px,y);cx.lineTo(rx,y);cx.stroke();y+=4;
cx.beginPath();cx.moveTo(px,y);cx.lineTo(rx,y);cx.stroke();y+=12;
cx.font="bold 17px 'Courier New',monospace";cx.fillStyle="#2c2c2c";cx.textAlign="left";cx.fillText("СЕБЕСТОИМОСТЬ:",px,y);
cx.textAlign="right";cx.fillText(fmt(cost)+" ₽",rx,y);y+=22;
if(hasSell){y+=4;cx.setLineDash([4,3]);cx.strokeStyle="#ccc";cx.lineWidth=1;cx.beginPath();cx.moveTo(px,y);cx.lineTo(rx,y);cx.stroke();y+=12;cx.setLineDash([]);
const ip=profit>=0;const sCur=CUR[opts.sell.currency]||CUR.RUB;
const rows=[["ЦЕНА ПРОДАЖИ:",fmt(parseFloat(opts.sell.price))+" "+sCur.symbol+(opts.sell.currency!=="RUB"?" = "+fmt(sellRub)+" ₽":""),null]];
if(opts.sell.currency!=="RUB")rows.push(["КУРС ПРОДАЖИ:",(opts.sell.currency==="EUR"?opts.sell.eurRate+" ₽/€":opts.sell.usdRate+" ₽/$"),null]);
rows.push(["ПРИБЫЛЬ:",(ip?"+":"")+fmt(profit)+" ₽",ip],["НАЦЕНКА:",(ip?"+":"")+fmtD(markup,1)+"%",ip],["МАРЖА:",(ip?"+":"")+fmtD(margin,1)+"%",ip]);
rows.forEach(([lab,v,c])=>{cx.font="bold 11px 'Courier New',monospace";cx.fillStyle="#2c2c2c";cx.textAlign="left";cx.fillText(lab,px,y);
cx.fillStyle=c===null?"#2c2c2c":c?"#1e8449":"#922b21";cx.textAlign="right";cx.fillText(v,rx,y);y+=20})}
y+=8;cx.setLineDash([4,3]);cx.strokeStyle="#ccc";cx.lineWidth=1;cx.beginPath();cx.moveTo(px,y);cx.lineTo(rx,y);cx.stroke();y+=14;cx.setLineDash([]);
cx.textAlign="center";cx.fillStyle="#aaa";cx.font="10px 'Courier New',monospace";cx.fillText("СПАСИБО ЗА РАСЧЁТ!",mx,y);y+=14;cx.fillText("★ ★ ★",mx,y);
for(let x=6;x<W;x+=12){cx.beginPath();cx.arc(x,tH,3,0,Math.PI*2);cx.fillStyle="#fff";cx.fill()}
return cv.toDataURL("image/png")}

function downloadPNG(dataUrl,name){
try{const a=document.createElement("a");
const sn=name?name.replace(/[^a-zA-Zа-яА-ЯёЁ0-9\s-]/g,"").replace(/\s+/g,"_"):"авто";
a.download="Чек_"+sn+"_"+new Date().toLocaleDateString("ru-RU").replace(/\./g,"-")+".png";
a.href=dataUrl;document.body.appendChild(a);a.click();document.body.removeChild(a)}catch(_){}}

function saveCalcReceipt(){
const sp=parseFloat(S.sellPrice)||0;
const du=drawReceiptPNG({name:S.carName.trim(),eurRate:S.eurRate,usdRate:S.usdRate,entries:S.entries,
sell:sp>0?{price:S.sellPrice,currency:S.sellCurrency,eurRate:S.eurRate,usdRate:S.usdRate}:null});
S.receiptImage=du;downloadPNG(du,S.carName.trim());render();
setTimeout(()=>document.getElementById("saved-img")?.scrollIntoView({behavior:"smooth"}),100)}

function carReceipt(id){
const car=S.warehouse.find(c=>c.id===id);if(!car)return;
const du=drawReceiptPNG({name:car.name,eurRate:car.eurRate,usdRate:car.usdRate,entries:car.entries,
sell:car.status==="sold"&&parseFloat(car.sellPrice)?{price:car.sellPrice,currency:car.sellCurrency,
eurRate:car.sellEurRate||car.eurRate,usdRate:car.sellUsdRate||car.usdRate}:null});
S.carReceipts[id]=du;S.expandedCar=id;downloadPNG(du,car.name);render()}

render();
</script>
